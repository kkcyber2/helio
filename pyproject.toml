[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helio"
version = "1.0.0"
description = '3D product configurator with a real server-side cart, pricing rules and order records.'
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Konain Sultan Khan (KK)", email = "kkdev9715@gmail.com"}]
keywords = ["helio"]

[project.urls]
Homepage = "https://github.com/kkcyber2/helio"
Repository = "https://github.com/kkcyber2/helio"

[tool.setuptools]
packages = ["helio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
